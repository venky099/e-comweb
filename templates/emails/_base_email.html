{% comment %}
  Shared shell for transactional email.

  Inline styles only: an email client will not fetch a stylesheet, and many
  strip <style> blocks entirely.
{% endcomment %}
<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#14181f;max-width:560px;margin:0 auto;padding:24px;">
  <p style="font-size:18px;font-weight:700;margin:0 0 18px;">{{ site_name }}</p>
  {% block content %}{% endblock %}
  <p style="margin-top:28px;padding-top:14px;border-top:1px solid #e6e9ee;font-size:12px;color:#6b7382;">
    Questions? Reply to this email or write to {{ support_email }}.
  </p>
</div>
