{% if user.is_authenticated and user.id != review.user_id %}
  <form method="post" action="{% url 'reviews:helpful' review.pk %}"
        hx-post="{% url 'reviews:helpful' review.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <button class="btn btn-link btn-sm p-0 text-decoration-none {% if voted %}text-success{% else %}text-body-secondary{% endif %}"
            type="submit" {% if voted %}disabled{% endif %}>
      <i class="bi {% if voted %}bi-hand-thumbs-up-fill{% else %}bi-hand-thumbs-up{% endif %} me-1"></i>
      Helpful{% if review.helpful_count %} ({{ review.helpful_count }}){% endif %}
    </button>
  </form>
{% elif review.helpful_count %}
  <span class="small text-body-secondary">
    <i class="bi bi-hand-thumbs-up me-1"></i>{{ review.helpful_count }} found this helpful
  </span>
{% endif %}
