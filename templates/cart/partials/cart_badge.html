{% comment %}
Returned after an HTMX add-to-cart. Updates every cart counter out-of-band
(header and mobile bar), then fires `cart-changed` so the drawer reloads and
opens itself.
{% endcomment %}
<span id="cart-count" class="badge rounded-pill bg-primary nav-badge {% if not cart.item_count %}d-none{% endif %}"
      hx-swap-oob="true">{{ cart.item_count }}</span>

{% if added %}
  <span data-open-cart-drawer hidden></span>
{% endif %}
