{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="container-xxl">
  <div class="auth-card text-center">
    <i class="bi bi-envelope-check text-primary" style="font-size:2.5rem"></i>
    <h1 class="h5 fw-bold mt-2">Check your email</h1>
    <p class="small text-body-secondary">
      If an account exists for that address, we have sent a password reset link.
      It expires in a few hours &mdash; check your spam folder if it does not arrive.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary w-100">Back to sign in</a>
  </div>
</div>
{% endblock %}
