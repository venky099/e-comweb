{% extends "base.html" %}
{% block title %}New support request{% endblock %}

{% block content %}
<div class="container-xxl py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h1 class="h4 mb-3">How can we help?</h1>

      <form method="post" enctype="multipart/form-data" class="bg-body border rounded-3 p-3 p-md-4">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
          </div>
        {% endfor %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Send request</button>
          <a href="{% url 'support:list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
