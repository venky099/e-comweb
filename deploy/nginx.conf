# ---------------------------------------------------------------------------
# Nginx site configuration for the e-commerce storefront.
#
# Install as /etc/nginx/sites-available/ecommerce and symlink into
# sites-enabled, then:  nginx -t && systemctl reload nginx
#
# TLS certificates below assume Certbot (Let's Encrypt). On AWS you can
# terminate TLS at an ALB with an ACM certificate instead and drop the
# ssl_* directives -- keep the X-Forwarded-Proto header either way, because
# SECURE_PROXY_SSL_HEADER in config/settings/prod.py relies on it.
# ---------------------------------------------------------------------------

upstream ecommerce_app {
    server unix:/run/gunicorn/ecommerce.sock fail_timeout=0;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Django also sets these; belt and braces at the edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12M;   # matches DATA_UPLOAD_MAX_MEMORY_SIZE
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # ---- static & media -------------------------------------------------
    # Skip these when serving from S3/CloudFront (USE_S3=True).
    location /static/ {
        alias /srv/ecommerce/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/ecommerce/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---- application ----------------------------------------------------
    location / {
        proxy_pass http://ecommerce_app;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Payment webhooks must never be cached or buffered.
    location /payments/webhook/ {
        proxy_pass http://ecommerce_app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
